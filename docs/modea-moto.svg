<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Nomenclature d'une moto décrite dans Modea">
  <title>Nomenclature d'une moto décrite dans Modea</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="75%"><stop offset="0" stop-color="#0E6A75"/><stop offset=".6" stop-color="#0A4B5D"/><stop offset="1" stop-color="#042630"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#8fe3ea" opacity=".14"/></pattern>
    <style>
      .ln{fill:none;stroke:#9ff0f5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#9ff0f5;stroke-width:2.2;stroke-linecap:round;opacity:.75}
      .gold{fill:none;stroke:#F0C060;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .lead{fill:none;stroke:#F0C060;stroke-width:1.6;stroke-dasharray:5 6;opacity:.9}
      .pill{fill:#06323d;stroke:#F0C060;stroke-width:2}
      .pillb{fill:#06323d;stroke:#9ff0f5;stroke-width:2}
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
      .s{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:13px;font-weight:500;fill:#F0C060;letter-spacing:.08em}
      .c{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:600;fill:#d8f7f9}
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#dots)"/>

  <!-- moto -->
  <g filter="url(#glow)" transform="translate(20,40)">
    <!-- roues -->
    <g class="ln"><circle cx="320" cy="390" r="112"/><circle cx="880" cy="390" r="112"/></g>
    <g class="thin"><circle cx="320" cy="390" r="92"/><circle cx="880" cy="390" r="92"/><circle cx="320" cy="390" r="22"/><circle cx="880" cy="390" r="22"/>
      <path d="M320 298V482M228 390H412M255 325L385 455M385 325L255 455"/><path d="M880 298V482M788 390H972M815 325L945 455M945 325L815 455"/></g>
    <circle class="gold" cx="880" cy="390" r="62" stroke-width="3.5"/>
    <path class="gold" d="M930 330 q26 20 14 58 l-18 -4 q8 -26 -10 -40z" stroke-width="3"/>
    <!-- fourche + guidon -->
    <path class="ln" d="M742 215L880 390"/><path class="thin" d="M756 208L894 383"/>
    <path class="ln" d="M735 205L700 182L640 190"/>
    <path class="ln" d="M770 232c34 6 52 28 40 52c-22 4 -46 -6 -58 -30z"/>
    <!-- cadre + bras oscillant + amortisseur -->
    <path class="ln" d="M735 235L545 305L505 372L320 390"/>
    <path class="ln" d="M575 288L395 290"/>
    <path class="thin" d="M540 306L498 372M520 300L474 362"/>
    <!-- réservoir + selle + carénage arrière -->
    <path class="gold" d="M560 262C585 214 685 205 728 240L702 276L578 284Z"/>
    <path class="ln" d="M375 268C430 246 520 250 568 262L562 286L388 292C360 292 335 280 322 252C340 252 356 258 375 268Z"/>
    <rect class="gold" x="412" y="304" width="54" height="28" rx="5" stroke-width="3.5"/><path class="gold" d="M427 318h12M433 312v12M450 318h10" stroke-width="3"/>
    <!-- moteur -->
    <rect class="ln" x="548" y="310" width="150" height="82" rx="16"/>
    <path class="thin" d="M578 310V268M602 310V262M626 310V262M650 310V268M590 252h72"/>
    <circle class="ln" cx="640" cy="360" r="22"/><circle class="thin" cx="600" cy="378" r="9"/>
    <!-- échappement -->
    <path class="ln" d="M700 388C610 432 440 432 262 398L256 380C436 408 610 404 686 364"/>
    <path class="thin" d="M300 394l-6 -26M330 400l-6 -28M360 404l-6 -28"/>
  </g>

  <!-- annotations : graphe des ensembles -->
  <g>
    <path class="lead" d="M560 118L478 352"/>
    <path class="lead" d="M160 208L360 318"/>
    <path class="lead" d="M980 166L852 384"/>
    <path class="lead" d="M640 540L640 430"/>   <!-- motorisation -> moteur -->
    <path class="lead" d="M960 520L915 450"/>   <!-- freinage -->
    <circle cx="478" cy="352" r="6" fill="#F0C060"/><circle cx="360" cy="318" r="6" fill="#F0C060"/><circle cx="852" cy="384" r="6" fill="#F0C060"/>
    <circle cx="640" cy="430" r="6" fill="#F0C060"/><circle cx="915" cy="450" r="6" fill="#F0C060"/>

    <g transform="translate(400,60)"><rect class="pill" x="0" y="0" width="320" height="58" rx="14"/><text class="s" x="18" y="22">ENSEMBLE · ÉLECTRICITÉ</text><text class="t" x="18" y="46">Système électrique</text></g>
    <g transform="translate(40,150)"><rect class="pill" x="0" y="0" width="270" height="58" rx="14"/><text class="s" x="18" y="22">ENSEMBLE · CARROSSERIE</text><text class="t" x="18" y="46">Carrosserie</text></g>
    <g transform="translate(850,108)"><rect class="pill" x="0" y="0" width="300" height="58" rx="14"/><text class="s" x="18" y="22">ENSEMBLE · PARTIE-CYCLE</text><text class="t" x="18" y="46">Partie-cycle</text></g>
    <g transform="translate(470,540)"><rect class="pill" x="0" y="0" width="340" height="58" rx="14"/><text class="s" x="18" y="22">ENSEMBLE · MOTORISATION</text><text class="t" x="18" y="46">Motorisation</text></g>
    <g transform="translate(830,520)"><rect class="pillb" x="0" y="0" width="300" height="50" rx="14"/><text class="s" x="18" y="21">COMPOSANT · PARTIE-CYCLE</text><text class="c" x="18" y="40">Disque + étrier de frein</text></g>

    <g transform="translate(40,36)"><text class="s" x="0" y="0">MODÈLE D'EXEMPLE</text><text class="t" x="0" y="30" style="font-size:26px">Nomenclature d'une moto</text><text class="c" x="0" y="56">34 objets · 14 propriétés · 37 relations</text></g>
  </g>
</svg>
